<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persona Lab — User Personas & Stories</title>
<style>
:root{
  --paper:#f3efe3; --ink:#1e1d1a; --muted:#615f58; --rule:#b8b1a3;
  --yellow:#f2df66; --blue:#8fc6cf; --pink:#e5a9a3; --green:#a9c79e;
  --red:#b84638; --white:#fffdf7; --shadow:rgba(54,45,31,.16);
}
*{box-sizing:border-box}
html{background:#c8c2b5}
body{margin:0;color:var(--ink);font-family:Georgia,"Times New Roman",serif;background:
  linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,.18)),
  repeating-linear-gradient(0deg,#d3cec2 0,#d3cec2 1px,#cbc5b9 1px,#cbc5b9 4px);
min-height:100vh}
button,select,input,textarea{font:inherit}
button{color:inherit}
.shell{max-width:1180px;margin:0 auto;padding:18px}
.masthead{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin:6px 0 18px}
.logo{font-family:Arial Black,Impact,sans-serif;font-size:clamp(2rem,6vw,4.7rem);line-height:.82;letter-spacing:-.055em;text-transform:uppercase}
.logo small{display:block;font-family:"Courier New",monospace;font-size:.18em;letter-spacing:.2em;margin-top:11px}
.score-stamp{font-family:"Courier New",monospace;border:3px solid var(--red);color:var(--red);padding:9px 12px;transform:rotate(2deg);font-weight:900;background:rgba(255,253,247,.6)}
.stage-strip{display:grid;grid-template-columns:repeat(6,1fr);border:2px solid var(--ink);background:var(--white);margin-bottom:18px}
.stage-dot{min-height:38px;display:flex;align-items:center;justify-content:center;padding:6px;border-right:1px solid var(--ink);font:700 .72rem "Courier New",monospace;text-align:center}
.stage-dot:last-child{border-right:0}.stage-dot.done{background:var(--ink);color:var(--paper)}.stage-dot.current{background:var(--yellow)}
.workspace{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(230px,.75fr);gap:22px;align-items:start}
.paper{position:relative;background:var(--paper);border:1px solid #aaa292;padding:clamp(20px,4vw,44px);box-shadow:7px 9px 0 var(--shadow);min-height:560px}
.paper:before{content:"";position:absolute;left:34px;top:0;bottom:0;border-left:1px solid rgba(184,70,56,.22);pointer-events:none}
.paper>*{position:relative}
.sidebar{display:grid;gap:14px}
.clipboard,.note{padding:16px;background:var(--white);border:1px solid #9e9789;box-shadow:4px 5px 0 var(--shadow)}
.clipboard h3,.note h3{font:900 .78rem "Courier New",monospace;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}
.note{background:var(--yellow);transform:rotate(-1deg)}
.note:nth-child(even){background:#d8e7d1;transform:rotate(1deg)}
.kicker{font:900 .78rem "Courier New",monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--red);margin-bottom:8px}
h1,h2,h3{font-family:Arial,Helvetica,sans-serif;letter-spacing:-.03em}
h1,h2{font-weight:900}h2{font-size:clamp(1.8rem,4vw,3rem);margin:0 0 8px}
h3{margin-top:0}
p{line-height:1.55;margin:8px 0 14px}.lead{font-size:1.1rem;max-width:720px}
.rule{border:0;border-top:2px solid var(--ink);margin:24px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.choice{position:relative;width:100%;text-align:left;border:2px solid var(--ink);background:var(--white);padding:16px;min-height:116px;cursor:pointer;box-shadow:3px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.choice:hover,.choice:focus-visible{transform:translate(-2px,-2px);box-shadow:5px 6px 0 var(--ink);outline:3px solid var(--blue);outline-offset:2px}
.choice.selected{background:var(--yellow)}
.choice.selected:after{content:"✓";position:absolute;right:10px;top:7px;font:900 1.5rem Arial;color:var(--red);transform:rotate(-10deg)}
.persona{min-height:250px}.avatar{font-size:2.5rem}.meta{font:700 .75rem "Courier New",monospace;text-transform:uppercase}
.mini-list{margin:10px 0 0;padding-left:18px}.mini-list li{margin:5px 0}
.sticker{display:inline-block;background:var(--blue);padding:4px 7px;font:700 .72rem "Courier New",monospace;transform:rotate(-1deg)}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 15px;min-height:44px;font:900 .85rem "Courier New",monospace;text-transform:uppercase;cursor:pointer;box-shadow:3px 3px 0 var(--red)}
.btn.alt{background:var(--paper);color:var(--ink);box-shadow:3px 3px 0 var(--blue)}
.btn:hover,.btn:focus-visible{transform:translate(-1px,-1px);outline:3px solid var(--yellow);outline-offset:2px}
.feedback{display:none;margin-top:20px;padding:14px 16px;border-left:7px solid var(--red);background:#f3dfd9;font-weight:700}
.feedback.good{display:block;border-color:#557d4e;background:#e1ecd9}.feedback.bad{display:block}
.story-form{margin:16px 0;padding:15px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.story-form label{display:block;font:900 .75rem "Courier New",monospace;margin-bottom:5px;text-transform:uppercase}
select,textarea,input{width:100%;border:0;border-bottom:2px solid var(--ink);background:rgba(255,255,255,.35);padding:10px 7px;font-size:1rem;border-radius:0}
select:focus,textarea:focus,input:focus{outline:3px solid var(--blue);outline-offset:2px}
.story-preview{background:var(--white);border:1px dashed var(--ink);padding:12px;margin-top:10px;font-style:italic}
.big-quote{font:900 clamp(1.25rem,3vw,2rem) Arial,Helvetica,sans-serif;border-left:10px solid var(--yellow);padding-left:14px;margin:22px 0}
.mark{background:linear-gradient(transparent 55%,rgba(242,223,102,.85) 55%)}
.casefile{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;border-top:2px solid var(--ink);padding-top:14px}
.case-no{font:900 2.8rem "Courier New",monospace;color:var(--red)}
.summary-card{border:2px solid var(--ink);background:var(--white);padding:14px;margin:10px 0;transform:rotate(-.2deg)}
.rating{font:900 clamp(3rem,8vw,6rem) Arial;color:var(--red);line-height:.9}
.small{font-size:.86rem;color:var(--muted)}
.print-note{font:700 .72rem "Courier New",monospace}
@media(max-width:820px){.workspace{grid-template-columns:1fr}.sidebar{grid-template-columns:1fr 1fr}.paper{min-height:auto}.paper:before{left:22px}}
@media(max-width:520px){.shell{padding:10px}.masthead{grid-template-columns:1fr}.score-stamp{justify-self:start}.stage-strip{grid-template-columns:repeat(3,1fr)}.stage-dot{border-bottom:1px solid var(--ink)}.sidebar{grid-template-columns:1fr}.paper{padding:20px 18px}.paper:before{display:none}.btn{width:100%}}
@media print{body{background:white}.sidebar,.masthead,.stage-strip,.btns{display:none}.workspace{display:block}.paper{box-shadow:none;border:0}}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div class="logo">Persona Lab<small>USER RESEARCH → USER STORIES → BETTER REQUIREMENTS</small></div>
    <div class="score-stamp" id="scoreTop">SCORE 000</div>
  </header>
  <nav class="stage-strip" id="stageStrip" aria-label="Activity progress"></nav>
  <div class="workspace">
    <main class="paper" id="screen"></main>
    <aside class="sidebar">
      <section class="clipboard">
        <h3>Working file</h3>
        <div id="workingFile" class="small">No persona selected yet.</div>
      </section>
      <section class="note">
        <h3>Rule #1</h3>
        <div id="tip">You are not designing for yourself.</div>
      </section>
      <section class="note">
        <h3>What links together?</h3>
        <div><strong>Persona → need → user story → feature</strong></div>
      </section>
    </aside>
  </div>
</div>
<script>
const screen=document.getElementById('screen'), scoreTop=document.getElementById('scoreTop'), workingFile=document.getElementById('workingFile'), tip=document.getElementById('tip'), stageStrip=document.getElementById('stageStrip');
let step=1,score=0,persona=null,selectedNeeds=[],builtStories=[],qualityAnswers=0,priority=null;

const stages=['Brief','Persona','Evidence','Stories','Critique','Priority'];
const personas=[
{id:'maya',avatar:'🎧',name:'Maya Patel',age:17,role:'Sixth-form student',device:'Mostly phone',context:'Revises on buses and in short gaps between lessons. Mobile signal is not always reliable.',goals:['Revise in short bursts','See progress quickly','Use the service comfortably on a phone'],frustrations:['Long walls of text','Losing progress','Desktop-first layouts'],access:'Clear text, strong contrast and large touch targets.'},
{id:'dan',avatar:'☕',name:'Dan Reeves',age:42,role:'Part-time mature learner',device:'Laptop at home',context:'Works full-time and studies late in the evening. He has little patience for hunting through menus.',goals:['Find exactly what he needs','Resume previous work','Understand unfamiliar terminology'],frustrations:['Hidden navigation','Unexplained jargon','Unnecessary steps'],access:'Plain language, obvious navigation and reliable save/resume.'},
{id:'leo',avatar:'⌨️',name:'Leo Brooks',age:19,role:'College student',device:'Laptop + keyboard',context:'Technically confident. Uses keyboard navigation and assistive technology rather than relying on a mouse.',goals:['Reach every control by keyboard','Know where focus is','Complete the same tasks as everyone else'],frustrations:['Mouse-only controls','Invisible focus states','Unlabelled icons'],access:'Keyboard access, visible focus and meaningful labels.'}
];

const needs=[
{t:'Save progress automatically',for:['maya','dan'],why:'Interrupted study sessions make save/resume genuinely useful.'},
{t:'Responsive mobile layout',for:['maya'],why:'Maya mainly uses a phone.'},
{t:'Keyboard-accessible controls',for:['leo'],why:'Leo needs to operate the interface without a mouse.'},
{t:'Strong visible focus states',for:['leo'],why:'Keyboard users need to see which control currently has focus.'},
{t:'Plain-language explanations',for:['dan'],why:'Dan is frustrated by unexplained terminology.'},
{t:'Fast topic search',for:['dan','maya'],why:'Both users need to reach useful content quickly.'},
{t:'Animated 3D landing page',for:[],why:'No persona evidence supports this. It is a design preference.'},
{t:'Autoplay background music',for:[],why:'It does not solve a user problem and may create a barrier.'}
];

const storyData={
maya:[
['save my revision progress','I can continue later'],
['complete short quizzes comfortably on my phone','I can revise during short gaps'],
['download a topic before travelling','I can study when my signal is poor']
],
dan:[
['search directly for a topic','I do not waste my limited study time'],
['see plain-English explanations of technical terms','I can understand unfamiliar content'],
['resume my last activity','I can continue where I stopped after work']
],
leo:[
['use every interactive control from the keyboard','I can navigate without a mouse'],
['see a clear focus indicator','I always know where I am on the page'],
['get meaningful text labels for controls','my assistive technology can identify them']
]
};

const critique=[
{story:'As a student, I want a dark blue navigation bar, so that the website looks modern.',good:false,why:'It jumps straight to a visual solution. It does not explain a genuine user need.'},
{story:'As a student, I want my progress to be saved, so that I can continue revising later.',good:true,why:'It names a user, a goal and the value of achieving it.'},
{story:'As a user, I want the database to use SQL, so that the backend is efficient.',good:false,why:'That is an implementation choice. A user would not normally care how the backend is built.'}
];

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function update(){
  scoreTop.textContent='SCORE '+String(score).padStart(3,'0');
  stageStrip.innerHTML=stages.map((s,i)=>'<div class="stage-dot '+(i+1<step?'done':i+1===step?'current':'')+'">'+(i+1)+'. '+s+'</div>').join('');
  if(persona){
    workingFile.innerHTML='<strong>'+esc(persona.name)+'</strong><br>'+esc(persona.role)+'<br><span class="small">'+builtStories.length+' user '+(builtStories.length===1?'story':'stories')+' drafted</span>';
  } else workingFile.textContent='No persona selected yet.';
}
function addScore(n){score+=n;update()}
function render(html){screen.innerHTML=html;update();window.scrollTo({top:0,behavior:'smooth'})}
function button(text,fn,alt=false){const b=document.createElement('button');b.type='button';b.className='btn'+(alt?' alt':'');b.textContent=text;b.addEventListener('click',fn);return b}
function actions(){const d=document.createElement('div');d.className='btns';return d}
function next(text,fn){const a=actions();a.append(button(text,fn));screen.append(a)}

function stage1(){
  step=1;tip.textContent='You are not designing for yourself.';
  render('<div class="kicker">Client brief / 01</div><h2>StudySprint needs a redesign.</h2><p class="lead">A college has asked your team to improve its revision web app. The old team kept adding features they personally liked. Students still hate using it.</p><hr class="rule"><div class="casefile"><div class="case-no">01</div><div><h3>Your job</h3><p>Work like a UX designer. Use evidence about a real type of user, turn that evidence into needs, then write user stories that could guide development.</p><div class="big-quote">Do not ask: <span class="mark">“What would look cool?”</span><br>Ask: “What does this user actually need?”</div></div></div>');
  next('Open the user files →',()=>{step=2;stage2()})
}

function stage2(){
  tip.textContent='A persona is useful because it gives design decisions a specific human context.';
  render('<div class="kicker">User files / 02</div><h2>Pick one person to design for.</h2><p class="lead">Read the context, not just the age or job title. Your later choices must be supported by what the persona actually tells you.</p><div class="grid" id="personaGrid"></div>');
  const g=document.getElementById('personaGrid');
  personas.forEach(p=>{
    const b=document.createElement('button');b.type='button';b.className='choice persona';
    b.innerHTML='<div class="avatar">'+p.avatar+'</div><div class="meta">'+esc(p.device)+'</div><h3>'+esc(p.name)+', '+p.age+'</h3><span class="sticker">'+esc(p.role)+'</span><p>'+esc(p.context)+'</p><p class="small"><strong>Accessibility / usability:</strong> '+esc(p.access)+'</p>';
    b.addEventListener('click',()=>{persona=p;addScore(10);step=3;stage3()});g.append(b)
  })
}

function stage3(){
  selectedNeeds=[];tip.textContent='A requirement is stronger when you can point to evidence that justifies it.';
  render('<div class="kicker">Evidence board / 03</div><h2>Which requirements can you defend?</h2><p class="lead">Select exactly <strong>three</strong>. Some cards sound attractive but have no evidence behind them.</p><div class="summary-card"><strong>'+esc(persona.name)+'</strong><br><span class="small">'+esc(persona.context)+'</span></div><div class="grid" id="needsGrid"></div><div id="feedback" class="feedback" aria-live="polite"></div>');
  const relevant=needs.filter(n=>n.for.includes(persona.id)).sort(()=>Math.random()-.5).slice(0,3);
  const distractors=needs.filter(n=>!n.for.includes(persona.id)).sort(()=>Math.random()-.5).slice(0,3);
  const cards=[...relevant,...distractors].sort(()=>Math.random()-.5);
  const g=document.getElementById('needsGrid');
  cards.forEach(n=>{
    const b=document.createElement('button');b.type='button';b.className='choice';b.innerHTML='<strong>'+esc(n.t)+'</strong>';
    b.addEventListener('click',()=>{b.classList.toggle('selected'); if(b.classList.contains('selected')) selectedNeeds.push(n); else selectedNeeds=selectedNeeds.filter(x=>x!==n)});
    g.append(b)
  });
  const a=actions();a.append(button('Check the evidence',()=>{
    const fb=document.getElementById('feedback');
    if(selectedNeeds.length!==3){fb.className='feedback bad';fb.textContent='Red pen: choose exactly three cards before checking.';return}
    const correct=selectedNeeds.filter(n=>n.for.includes(persona.id)).length;
    addScore(correct*10);
    fb.className='feedback '+(correct===3?'good':'bad');
    fb.innerHTML='<strong>'+correct+'/3 supported by the persona.</strong><br><br>'+selectedNeeds.map(n=>'• <strong>'+esc(n.t)+'</strong> — '+esc(n.why)).join('<br>');
    a.innerHTML='';a.append(button('Turn needs into stories →',()=>{step=4;stage4()}))
  }));screen.append(a)
}

function stage4(){
  builtStories=[];tip.textContent='The “so that” matters. It explains the value, not just the action.';
  const rows=storyData[persona.id];
  render('<div class="kicker">Story workshop / 04</div><h2>Write stories from the evidence.</h2><p class="lead">This time you are not simply clicking a ready-made sentence. Build each story by pairing a genuine goal with the reason it matters.</p><div class="big-quote">As a <span class="mark">[user]</span>, I want <span class="mark">[goal]</span>, so that <span class="mark">[benefit]</span>.</div><div id="storyForms"></div><div id="feedback" class="feedback" aria-live="polite"></div>');
  const wrap=document.getElementById('storyForms');
  for(let i=0;i<3;i++){
    const d=document.createElement('div');d.className='story-form';
    d.innerHTML='<label>Story '+(i+1)+' — what does '+esc(persona.name.split(' ')[0])+' want?</label><select data-w="'+i+'"><option value="">Choose a goal…</option>'+rows.map((r,j)=>'<option value="'+j+'">'+esc(r[0])+'</option>').join('')+'</select><label style="margin-top:12px">Why does it matter?</label><select data-b="'+i+'"><option value="">Choose a benefit…</option>'+rows.map((r,j)=>'<option value="'+j+'">'+esc(r[1])+'</option>').join('')+'</select><div class="story-preview" id="preview'+i+'">Your story will appear here.</div>';
    wrap.append(d);
    d.querySelectorAll('select').forEach(s=>s.addEventListener('change',()=>preview(i)))
  }
  function preview(i){
    const wi=document.querySelector('[data-w="'+i+'"]').value, bi=document.querySelector('[data-b="'+i+'"]').value, p=document.getElementById('preview'+i);
    if(wi===''||bi===''){p.textContent='Your story will appear here.';return}
    p.textContent='As '+persona.role.toLowerCase()+', I want to '+rows[+wi][0]+', so that '+rows[+bi][1]+'.'
  }
  const a=actions();a.append(button('Review my stories',()=>{
    builtStories=[];let complete=true,matched=0;
    for(let i=0;i<3;i++){
      const wi=document.querySelector('[data-w="'+i+'"]').value, bi=document.querySelector('[data-b="'+i+'"]').value;
      if(wi===''||bi===''){complete=false;continue}
      if(wi===bi)matched++;
      builtStories.push('As a '+persona.role.toLowerCase()+', I want to '+rows[+wi][0]+', so that '+rows[+bi][1]+'.')
    }
    const fb=document.getElementById('feedback');
    if(!complete){fb.className='feedback bad';fb.textContent='Red pen: complete all three stories first.';return}
    addScore(matched*10);
    fb.className='feedback '+(matched===3?'good':'bad');
    fb.innerHTML='<strong>'+matched+'/3 goals paired with the strongest matching benefit.</strong><br>'+(matched===3?'Nice. The story explains both what the user wants and why.':'Some combinations are grammatically valid, but the strongest stories link the goal to the most relevant benefit.');
    a.innerHTML='';a.append(button('Critique other stories →',()=>{step=5;stage5()}))
  }));screen.append(a)
}

function stage5(){
  tip.textContent='A user story is not a colour choice, a database choice or a vague wish.';
  qualityAnswers=0;let qi=0;
  function ask(){
    const q=critique[qi];
    render('<div class="kicker">Red-pen review / 05</div><h2>Would you accept this story?</h2><p class="lead">Pretend this has just been pinned to your team backlog.</p><div class="summary-card"><div class="meta">Story '+(qi+1)+' of '+critique.length+'</div><p style="font-size:1.2rem"><strong>'+esc(q.story)+'</strong></p></div><div id="feedback" class="feedback" aria-live="polite"></div>');
    const a=actions();
    function answer(v){
      const hit=v===q.good;if(hit){addScore(10);qualityAnswers++}
      const fb=document.getElementById('feedback');fb.className='feedback '+(hit?'good':'bad');
      fb.innerHTML='<strong>'+(hit?'✓ Good call.':'✗ Reconsider it.')+'</strong> '+esc(q.why);
      a.innerHTML='';a.append(button(qi<critique.length-1?'Next story →':'Open the backlog →',()=>{qi++;if(qi<critique.length)ask();else{step=6;stage6()}}))
    }
    a.append(button('Accept',()=>answer(true)));a.append(button('Reject',()=>answer(false),true));screen.append(a)
  }
  ask()
}

function stage6(){
  tip.textContent='Prioritising means making a justified trade-off, not saying everything is important.';
  priority=null;
  render('<div class="kicker">Backlog / 06</div><h2>You only have time to build one first.</h2><p class="lead">Choose the story you would put at the top of the backlog, then justify your choice in one sentence.</p><div id="backlog"></div><div class="story-form"><label for="reason">Why should this come first?</label><textarea id="reason" rows="3" maxlength="240" placeholder="Because this persona…"></textarea></div><div id="feedback" class="feedback" aria-live="polite"></div>');
  const b=document.getElementById('backlog');
  builtStories.forEach((s,i)=>{
    const c=document.createElement('button');c.type='button';c.className='choice';c.style.marginBottom='10px';c.innerHTML='<span class="meta">Backlog card '+(i+1)+'</span><p><strong>'+esc(s)+'</strong></p>';
    c.addEventListener('click',()=>{[...b.children].forEach(x=>x.classList.remove('selected'));c.classList.add('selected');priority=i});b.append(c)
  });
  const a=actions();a.append(button('Finish the design file',()=>{
    const reason=document.getElementById('reason').value.trim(),fb=document.getElementById('feedback');
    if(priority===null){fb.className='feedback bad';fb.textContent='Choose one backlog card first.';return}
    if(reason.length<25){fb.className='feedback bad';fb.textContent='Give a proper justification — at least one clear sentence.';return}
    addScore(20);showResults(reason)
  }));screen.append(a)
}

function showResults(reason){
  stageStrip.innerHTML=stages.map((s,i)=>'<div class="stage-dot done">'+(i+1)+'. '+s+'</div>').join('');
  tip.textContent='Good UX decisions can be traced back to evidence about a user.';
  const max=120, pct=Math.round(score/max*100);
  render('<div class="kicker">Completed UX file</div><div class="rating">'+pct+'%</div><h2>'+esc(persona.name)+' design case</h2><p class="lead">You traced a line from a person, to evidence, to needs, to stories, to a prioritised development decision.</p><hr class="rule"><div class="casefile"><div class="case-no">✓</div><div><h3>Persona</h3><p><strong>'+esc(persona.name)+'</strong> — '+esc(persona.role)+'</p><p>'+esc(persona.context)+'</p><p><strong>Key frustrations:</strong> '+persona.frustrations.map(esc).join(' · ')+'</p></div></div><h3 style="margin-top:28px">Your user stories</h3>'+builtStories.map((s,i)=>'<div class="summary-card"><span class="meta">Story '+(i+1)+(i===priority?' — PRIORITY':'')+'</span><p>'+esc(s)+'</p></div>').join('')+'<div class="summary-card" style="background:#f2df66"><span class="meta">Priority justification</span><p>'+esc(reason)+'</p></div><p class="print-note">Teacher evidence: this page can be printed or screenshotted.</p>');
  const a=actions();a.append(button('Start again',()=>{step=1;score=0;persona=null;selectedNeeds=[];builtStories=[];priority=null;stage1()},true));a.append(button('Print / save evidence',()=>window.print()));screen.append(a);update()
}

stage1();
</script>
</body>
</html>
